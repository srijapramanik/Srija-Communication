<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>প্রয়োজনীয় ওয়েবসাইট | SRIJA COMMUNICATION</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f4f7fb;color:#222}
header{background:linear-gradient(135deg,#075e54,#128c7e);color:#fff;text-align:center;padding:28px 16px}
header h1{margin:0 0 6px}.wrap{max-width:1100px;margin:auto;padding:28px 18px}
.back{display:inline-block;padding:10px 18px;background:#075e54;color:#fff;text-decoration:none;border-radius:8px;margin-bottom:22px}
h2{text-align:center;color:#075e54;margin:10px 0 28px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.link-card{background:#fff;border-radius:14px;padding:18px;text-align:center;box-shadow:0 3px 12px #00000012;border:1px solid #e3e9ee}
.link-card img{width:78px;height:78px;object-fit:contain;border-radius:12px;margin-bottom:10px;background:#fff}.link-card .no-image{font-size:64px;height:78px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}.link-card h3{min-height:28px}
.link-card h3{margin:8px 0 14px;color:#075e54}.open{display:inline-block;padding:10px 18px;background:#075e54;color:#fff;text-decoration:none;border-radius:8px;font-weight:bold}
.empty{text-align:center;background:#fff;border:1px dashed #b8c6cf;border-radius:14px;padding:30px;color:#667}
footer{background:#063f39;color:#fff;text-align:center;padding:17px;margin-top:30px}
</style>
</head>
<body>
<header><h1>শ্রীজা কমিউনিকেশন</h1><p>প্রয়োজনীয় ওয়েবসাইট</p></header>
<div class="wrap">
<a class="back" href="index.html">← প্রথম পেজে ফিরে যান</a>
<h2>🌐 Official links</h2>
<div id="links" class="links"></div>
</div>
<footer>© 2026 SRIJA COMMUNICATION</footer>
<script>
const LINK_KEY="srija_communication_link_page_v1";
function renderLinks(){
  const box=document.getElementById("links");
  let data=[];
  try{data=JSON.parse(localStorage.getItem(LINK_KEY)||"[]")}catch(e){data=[]}
  box.innerHTML="";
  if(!Array.isArray(data)||data.length===0){
    box.innerHTML='<div class="empty">এখনও কোনো ওয়েবসাইট লিঙ্ক যোগ করা হয়নি।</div>';
    return;
  }
  data.forEach(item=>{
    const card=document.createElement("div");
    card.className="link-card";
    const safeUrl=typeof item.url==="string"&&/^https?:\\/\\//i.test(item.url)?item.url:"#";
    card.innerHTML='<div class="no-image">🌐</div><h3></h3><a class="open" target="_blank" rel="noopener noreferrer">ওয়েবসাইট খুলুন</a>';
    card.querySelector("h3").textContent=item.name||"ওয়েবসাইট";
    if(item.image){
      const img=document.createElement("img");
      img.src=item.image; img.alt=item.name||"ওয়েবসাইট";
      card.querySelector("div").replaceWith(img);
    }
    const a=card.querySelector("a"); a.href=safeUrl;
    box.appendChild(card);
  });
}
renderLinks();
</script>
</body>
</html>
